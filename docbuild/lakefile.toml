# docbuild — the generated-API-docs subproject (plan 010).
#
# A SEPARATE lake workspace so the parent `bang-lang` package stays untouched:
# doc-gen4 (and its md4lean / BibtexQuery / UnicodeBasic deps) resolve into
# THIS workspace's `.lake/`, never the root manifest. The root `lakefile.toml`
# and `lake-manifest.json` are byte-identical to base — doc-gen4 is a
# dependency-ring cost we pay only when rendering docs.
#
# Build: `just docs` (= `cd docbuild && lake build Bang:docs`). NOT in the
# verify gate — doc-gen4 + the import-closure page render is slow by design.
#
# The `bang-lang` require is BY PATH (`..`): doc-gen4's `Bang:docs` facet
# renders the parent's already-built `Bang` oleans, so the parent must be built
# first (the reflink-seeded `.lake/build` from the main checkout covers this).
#
# doc-gen4's tag tracks the Lean release; it MUST match `lean-toolchain`
# (v4.30.0 here, copied from the parent). Bump both in lockstep on any
# toolchain move.
name = "docbuild"
defaultTargets = ["BangDocs:docs"]

# The doc-only barrel: GENERATED by `just docs` (a sorted import of every
# Bang/**/*.lean). Exists because the parent `Bang` lib is a rootless glob —
# doc-gen4 needs a root module to walk. Git-ignored; never hand-edit.
[[lean_lib]]
name = "BangDocs"

[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.30.0"

# DIRECT require shadowing doc-gen4's transitive UnicodeBasic (via BibtexQuery):
# upstream gates its extern_lib behind isWindows, so the precompiled per-module
# .so lacks the C symbols on Linux (lean4-unicode-basic#81 — held until Lake
# itself is fixed; Lake's maintainer concurs). This fork applies the un-gate
# diff already posted on that issue. DROP this block (and the fork) when
# upstream lands the fix. Operator-ruled 2026-07-11 (plan 010).
# Alternative once considered: hardeningDisable=["bindnow"] in the dev shell
# (lazy binding hides the missing symbol) — rejected as host-config-dependent
# with deferred-fault risk.
[[require]]
name = "UnicodeBasic"
git = "https://github.com/phibkro/lean4-unicode-basic"
rev = "eecf10c3fe1307e9198a61b2d208c000917f4ba3"

[[require]]
name = "bang-lang"
path = ".."
