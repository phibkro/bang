name: Release

# Binary distribution for `bang` — fires on a version tag (`v*`), builds the native
# runner for each Tier-1 platform (a 3-row matrix: x86_64-linux, aarch64-linux,
# aarch64-darwin), strips + smoke-tests each stripped artifact, and attaches all three
# to ONE GitHub Release. install.sh (README install line) picks the right asset by
# `uname`. The three rows share the tag; the create-vs-upload race is handled below.
#
# The BUILD half mirrors verify.yml exactly (nix installer + the elan/Mathlib-olean
# cache + `nix develop` for the toolchain) — the single sanctioned first-setup path,
# so a release build reuses the same warm cache a verify run leaves behind. The only
# addition here is `lake exe cache get`: unlike verify (which runs in a repo where the
# oleans are already fetched by prior CI), a release build off a fresh tag checkout has
# an empty `.lake`, so it fetches Mathlib's prebuilt oleans before `lake build bang`.
#
# The FIRST tag is the operator's call. This workflow never creates tags — it only
# reacts to one being pushed.

on:
  push:
    tags:
      - "v*"
  # Lets the operator prove the build+artifact half against a branch WITHOUT a tag
  # (the release-create step is tag-gated below, so a dispatch run builds + uploads a
  # CI artifact but does NOT publish a Release).
  workflow_dispatch:

permissions:
  contents: write # create the Release + upload the asset

jobs:
  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build strict Vocs docs site once before release artifacts
        run: bash tools/site-build.sh

  release:
    needs: site-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # Three Lean Tier-1 targets (distribution-survey.md rung 0). The build half is
    # platform-agnostic: `nix develop` → elan reads lean-toolchain and fetches the
    # RIGHT platform's Lean release, so the same steps produce a native binary on each
    # runner. release-artifact.sh guards the de-nix step by TRIPLE (ELF interp rewrite
    # on *-linux, strip-only + linkage-report on *-darwin — Mach-O has no ELF interp).
    #
    # fail-fast:false — the three artifacts are independent; one platform's failure must
    # not cancel a green build on the others (a partial release is better than none).
    #
    # Cold-build cost per row: ~2 min olean fetch + ~4 min lake build (README §cold-start),
    # so ~10 min/row warm-cache-miss. The actions/cache below warms elan + .lake per
    # (runner.os, TRIPLE); a cachix/magic-nix-cache layer would cut the nix-store rebuild
    # but needs an auth secret — flagged for the operator, NOT added here (no secrets).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, triple: x86_64-linux }
          - { os: ubuntu-24.04-arm, triple: aarch64-linux }
          - { os: macos-latest, triple: aarch64-darwin }

    env:
      TRIPLE: ${{ matrix.triple }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # match verify.yml (git-history-reading steps + clean describe)

      - name: Git gc posture (mirrors verify.yml / tools/setup.sh)
        run: git config gc.auto 0 && git config gc.autoDetach false

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache elan toolchain + Mathlib oleans
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lean-${{ matrix.triple }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lean-${{ matrix.triple }}-

      - name: Fetch Mathlib oleans (build-time dep — see README packaging note)
        run: nix develop --command lake exe cache get

      - name: Build the bang runner
        run: nix develop --command lake build bang

      - name: Determine version
        id: ver
        run: |
          # A tag push gives refs/tags/vX.Y.Z → strip refs/tags/; a workflow_dispatch on
          # a branch has no tag, so fall back to a short sha so the asset still names its
          # provenance (that run does not publish a Release, only uploads a CI artifact).
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=untagged-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare artifact (identity gate + strip + smoke)
        id: artifact
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          args=("$VERSION" "$TRIPLE")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=("${GITHUB_REF#refs/tags/}")
          fi
          nix develop --command bash tools/release-artifact.sh "${args[@]}"

      # A dispatch run stops here with the artifact as a downloadable CI artifact — no
      # Release is published (that is tag-only, below).
      - name: Upload build artifact (dispatch runs; also a fallback record on tag runs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.asset }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Create the Release (once) and upload this row's asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          # All three matrix rows share ONE tag → one Release. Whichever row lands first
          # creates it; the rest see "already exists" and just upload their asset. `gh
          # release create` is not idempotent, so create-if-absent then upload, rather
          # than racing three creates. `--clobber` lets a re-run replace a stale asset.
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "bang $VERSION" \
              --generate-notes \
              --notes "Native \`bang\` runner — prebuilt for x86_64-linux, aarch64-linux, and aarch64-darwin (Apple Silicon). Linux binaries link glibc + libgcc_s only and are de-nixed to the distro-standard loader (glibc 2.26+). The darwin binary is stripped but its dylib linkage is UNVERIFIED off the CI runner until the first real macOS install — see the asset's build log. Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VERSION}/tools/install.sh | sh\`" \
            || echo "release create raced with another row; falling through to upload"
          fi
          gh release upload "$VERSION" "$ASSET_PATH" --clobber
