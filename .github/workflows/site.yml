name: Site

# BUILD-ONLY validation for the vocs docs site — the pre-merge signal `pages.yml` doesn't
# give (pages.yml triggers push-to-main only, so a PR touching web/docs/** or docs/** currently
# gets no CI signal until after merge). This workflow never deploys and carries no `pages:`
# permission; it exists purely to catch a broken site build before it lands. Mirrors
# pages.yml's build step (same chromium fix for mmdc/mermaid-cli) — if that step's shape
# changes, update both (plan 011; landing pages.yml already covers deploy, so this workflow
# stays intentionally narrow rather than duplicating it).

on:
  push:
    branches: [main]
    paths:
      - "web/docs/**"
      - "docs/**"
  pull_request:
    paths:
      - "web/docs/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Build vocs docs site (validation only — output is not published)
        run: |
          cd web/docs
          bun install --frozen-lockfile
          # mmdc (mermaid-cli) pre-renders diagrams to static SVG — needs a headless
          # browser; bun blocks postinstall, so install it explicitly (matches pages.yml).
          # Falls back to pointer-notes if this fails (sync-docs.mjs), so this step isn't
          # itself a hard gate on chromium — the real gate is `bun run build` exiting 0.
          bunx puppeteer browsers install chrome-headless-shell
          bun run build
