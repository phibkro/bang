name: Site

# BUILD-ONLY validation for the vocs docs site — the pre-merge signal `pages.yml` doesn't
# give (pages.yml triggers push-to-main only, so a PR touching web/docs/** or docs/** currently
# gets no CI signal until after merge). This workflow never deploys and carries no `pages:`
# permission; it exists purely to catch a broken site build before it lands. Mirrors
# pages.yml calls the same `tools/site-build.sh` interface. Strict Mermaid rendering means
# a missing browser or broken diagram fails here instead of publishing a pointer-note fallback.

on:
  push:
    branches: [main]
    paths:
      - "web/docs/**"
      - "docs/**"
      - "README.md"
      - "ONBOARDING.md"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "CLAUDE.md"
      - "CHANGELOG.md"
      - "tools/site-build.sh"
      - "flake.nix"
      - "justfile"
  pull_request:
    paths:
      - "web/docs/**"
      - "docs/**"
      - "README.md"
      - "ONBOARDING.md"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "CLAUDE.md"
      - "CHANGELOG.md"
      - "tools/site-build.sh"
      - "flake.nix"
      - "justfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Build strict Vocs docs site (validation only — output is not published)
        run: bash tools/site-build.sh
